services:
  crawler:
    build: .
    image: new-stock-crawler:latest
    volumes:
      - ./output:/app/output
      - ./db:/app/db
      - ./secrets:/app/secrets
      - ./.env:/app/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/client_secret.json
      - TZ=Asia/Seoul
    # 실행 예시:
    # docker-compose run --rm crawler crawler full --drive
    # docker-compose run --rm crawler crawler daily --drive
    # docker-compose run --rm crawler crawler enrich

  # 컨테이너 내장 cron으로 daily 크롤링을 주기 실행 (스케줄은 docker/crontab 참고).
  # cron 데몬 기동에 root 권한이 필요해 user를 root로 오버라이드함.
  crawler-cron:
    build: .
    image: new-stock-crawler:latest
    entrypoint: ["/app/docker/cron-entrypoint.sh"]
    user: root
    restart: unless-stopped
    volumes:
      - ./output:/app/output
      - ./db:/app/db
      - ./secrets:/app/secrets
      - ./.env:/app/.env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/client_secret.json
      - TZ=Asia/Seoul
    # 반영구 운영 대비 - json-file 드라이버는 기본적으로 로그 크기 제한이 없어
    # 계속 커짐. 순수 컨테이너 stdout(cron 출력) 캡처분만 여기서 막는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
